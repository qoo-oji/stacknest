                spine:
                  type: integer
                  description: spine（章）インデックス（0 始まり・負数は 0 にクランプ）
                progress:
                  type: number
                  format: double
                  description: 章内の読書進捗率（0.0〜1.0・範囲外はクランプ）
                cfi:
                  type: string
                  nullable: true
                  description: EPUB CFI（任意・エンジンが対応する場合のみ）
                engine:
                  type: string
                  nullable: true
                  description: 生成元のレンダリングエンジン識別子（任意）
      responses:
        '200':
          description: 書き込み成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/LibraryLocked'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{lib}/books/{id}/direction:
    post:
      summary: ページ方向の書き戻し（本ごと DB 反映）
      description: |
        Web リーダーでの方向変更を本ごとの DB に反映する。
        `direction: null` または空文字で本ごと設定をクリア（ライブラリ既定に戻る）。
        **read の tier でも可。**
        変更後は `onBookChanged` コールバックが発火する。
      tags: [Viewer]
      operationId: setPageDirection
      x-stacknest-tier: read
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                direction:
                  type: string
                  nullable: true
                  enum: [rtl, ltr, null]
                  description: '"rtl" | "ltr" | null（null/空でクリア）'
      responses:
        '200':
          description: 書き込み成功
        '400':
          description: 不正な direction 値
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/LibraryLocked'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{lib}/books/{id}/rating:
    post:
      summary: 評価（rating）更新（R でも可）
      description: |
        書籍の評価（0–5）を更新する。
        **read の tier でも可（共有評価）。**
        変更後は `onBookChanged` コールバックが発火する。
      tags: [Books]
      operationId: setRating
      x-stacknest-tier: read
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 0
                  maximum: 5
      responses:
        '200':
          description: 更新成功
        '400':
          description: rating が 0–5 の範囲外
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/LibraryLocked'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{lib}/books/{id}/unseen:
    post:
      summary: 未読(unseen)フラグ更新（R でも可）
      description: |
        書籍の未読フラグを更新する。
        **read の tier でも可（共有閲覧状態）。**
        変更後は `onBookChanged` コールバックが発火する。
      tags: [Books]
      operationId: setUnseen
      x-stacknest-tier: read
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unseen]
              properties:
                unseen:
                  type: boolean
      responses:
        '200':
          description: 更新成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/LibraryLocked'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{lib}/books/{id}/file:
    get:
      summary: 原本ファイルダウンロード（octet-stream）
      description: |
        書籍の原本ファイルをバイナリで返す（オフラインダウンロード用）。
        ETag 付き。ファイルが存在しない場合は 404。
      tags: [Books]
      operationId: downloadBookFile
      x-stacknest-tier: read
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 原本ファイルバイナリ
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/LibraryLocked'
        '404':
          $ref: '#/components/responses/NotFound'

tags:
  - name: Server
    description: サーバ情報（認証不要）
  - name: Auth
    description: 認証・鍵の確認
  - name: Libraries
    description: ライブラリ一覧・棚・解錠
  - name: Books
    description: 書籍一覧・詳細・追加・削除・メタデータ編集
  - name: Cover
    description: 表紙画像・表紙編集
  - name: Stamps
    description: スタンプ定義・一括スタンプ適用
  - name: Labels
    description: ラベルカスタマイズ
  - name: Viewer
    description: ビューア（マニフェスト・ページ画像・進行状況・方向）
  - name: Grants
    description: グラントの管理（admin）
  - name: Shelves
    description: シェルフとスマートシェルフ
  - name: Settings
    description: 取り込み・監視フォルダ・一般の設定・プリセット
  - name: Integrity
    description: 整合性と重複の検査
  - name: Maintenance
    description: 保守のジョブ・バックアップ・DB の検査
  - name: Events
    description: SSE（サーバからの通知）
  - name: Local
    description: 127.0.0.1 の口で「ローカルコントロールを許可」が ON のときだけある（admin）。それ以外（共有サーバ、読書位置の同期だけの口）では 404
