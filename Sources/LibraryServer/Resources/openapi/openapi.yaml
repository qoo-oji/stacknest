      description: |
        指定フィールドの distinct 値リストを返す。ブラウズ UI 用。
        ロック庫は `X-Library-Token` ヘッダが必要。
        `field` は許可リスト（genre / neta / keyword_a / keyword_b / keyword_c など）に限定。
