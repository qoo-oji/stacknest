  /libraries/{lib}/books/{id}/detail:
    get:
      summary: 書籍詳細（フルメタデータ）
      description: |
        書籍のフルメタデータを返す。ロック庫は `X-Library-Token` ヘッダが必要。
      tags: [Books]
      operationId: getBookDetail
      x-stacknest-tier: read
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 書籍詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/LibraryLocked'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{lib}/books/{id}:
    patch:
      summary: 書籍メタデータ更新（edit 以上）
      description: |
        書籍のメタデータを部分更新する。null フィールドは変更しない。
        `clear*` フラグが true のフィールドは NULL 化する。
        **edit 以上の tier が必要。**
        更新後は `onBookChanged` コールバックが発火し Mac UI がリアルタイム反映される。
      tags: [Books]
      operationId: updateBook
      x-stacknest-tier: edit
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookPatchDTO'
      responses:
        '200':
          description: 更新後の書籍詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrLocked'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: 書籍削除（エントリ＋サムネ・edit 以上、`?trash=true` は admin）
      description: |
        書籍エントリとサムネイルを削除する。
        `?trash=true` を付けると実ファイルをゴミ箱に送る（サーバが trashFile をサポートしている場合のみ）。このときは admin の tier が要る（edit では 403）。
        **edit 以上の tier が必要。**
        削除後は `onLibraryStructureChanged` コールバックが発火する。
      tags: [Books]
      operationId: deleteBook
      x-stacknest-tier: edit
      x-stacknest-tier-note: '?trash=true のときは admin'
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: trash
          in: query
          schema:
            type: boolean
          description: true で実ファイルをゴミ箱へ（サーバサポート外は 501）
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrLocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          description: ゴミ箱機能が未サポート（Linux/ヘッドレス環境）

